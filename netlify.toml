# Statische site — geen buildstap nodig. De functie eronder wordt door Netlify
# zelf gebundeld; de pagina blijft één bestand dat je zo kunt openen.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
